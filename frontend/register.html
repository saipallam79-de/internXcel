<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | InternXcel</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">IX</span><span>Intern<span class="brand-accent">Xcel</span></span></a><main class="auth-card auth-wide"><p class="eyebrow">Your next chapter starts here</p><h1>Create your <em>path.</em></h1><form data-auth-form data-auth-mode="register" class="form-grid"><label>Full name<input name="full_name" required placeholder="Venkata Sai Pallam"></label><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Mobile number<input name="mobile" type="tel" pattern="[+0-9 ()-]{7,}" required placeholder="+91 98765 43210"></label><label>College name<input name="college" required placeholder="ABC University"></label><label>Degree<select name="degree"><option>B.Tech</option><option>BCA</option><option>MCA</option><option>B.Sc</option></select></label><label>Branch<input name="branch" required placeholder="AI & Data Science"></label><label>Graduation year<select name="year"><option>2026</option><option>2027</option><option>2028</option></select></label><label>Internship domain<select name="domain_id"><option value="1">AI & Machine Learning</option><option value="2">Data Science & Data Analytics</option><option value="3">Full Stack Web Development</option><option value="4">Java Development</option><option value="5">Python Development</option><option value="6">Cloud Computing & DevOps</option><option value="7">Cybersecurity</option><option value="8">UI/UX Design</option></select></label><label>Password<input name="password" type="password" minlength="8" required placeholder="At least 8 characters"></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" required placeholder="Repeat password"></label><button class="button button-primary form-submit" type="submit">Create account <span>→</span></button><p class="auth-message form-submit" data-auth-message aria-live="polite"></p></form><p class="auth-footer">Already registered? <a href="login.html">Log in</a></p></main><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
