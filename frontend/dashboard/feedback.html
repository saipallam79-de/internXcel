<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feedback | InternXcel</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"></head>
<body><main class="page-shell"><a class="arrow-link" href="index.html">← Dashboard</a><p class="eyebrow">Program feedback</p><h1 class="page-title">Help us<br><em>improve.</em></h1><section class="feedback-form-container"><p class="feedback-status" data-feedback-status>Loading feedback eligibility...</p><form class="feedback-form" data-feedback-form hidden><div class="form-group"><label>How would you rate your experience?<div class="rating-input" data-rating><input type="radio" name="rating" value="1"><input type="radio" name="rating" value="2"><input type="radio" name="rating" value="3"><input type="radio" name="rating" value="4"><input type="radio" name="rating" value="5"></div></label></div><div class="form-group"><label>What did you enjoy most?<textarea name="comment" placeholder="Tell us what resonated with you..." required minlength="5" maxlength="2000"></textarea></label></div><div class="form-group"><label>What did you learn from the internship?<textarea name="learned" placeholder="Skills, frameworks, professional growth..." maxlength="2000"></textarea></label></div><div class="form-group"><label><input type="checkbox" name="recommend" checked> I would recommend InternXcel to a friend</label></div><button class="button button-primary" type="submit">Submit feedback →</button><p class="auth-message" data-feedback-error aria-live="polite"></p></form></section></main><script src="../js/config.js"></script><script src="../js/feedback.js"></script></body></html>
