<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks | InternXcel</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"></head>
<body><main class="page-shell tasks-page"><a class="arrow-link" href="index.html">← Dashboard</a><p class="eyebrow">Practical work</p><h1 class="page-title">Make the work<br><em>visible.</em></h1><p class="page-lede" data-task-status>Loading your tasks...</p><div class="task-list" data-task-list></div><section class="submission-panel" data-submission-panel hidden><p class="eyebrow">Submit your task</p><h2 data-submission-title>Submission</h2><form data-task-form><input type="hidden" name="task_id"><label>GitHub repository URL<input name="github_url" type="url" placeholder="https://github.com/you/project"></label><label>Live project URL<input name="live_url" type="url" placeholder="https://your-project.example"></label><label>LinkedIn post URL<input name="linkedin_url" type="url" placeholder="https://linkedin.com/posts/..."></label><label>Note for your reviewer<textarea name="text_response" rows="4" placeholder="What did you learn and build?"></textarea></label><button class="button button-primary" type="submit">Submit for review →</button><p class="auth-message" data-task-message aria-live="polite"></p></form></section></main><script src="../js/tasks.js"></script></body></html>
