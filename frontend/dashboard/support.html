<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support | InternXcel</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"></head>
<body><main class="page-shell"><a class="arrow-link" href="index.html">← Dashboard</a><p class="eyebrow">Need a hand?</p><h1 class="page-title">You are not<br><em>doing this alone.</em></h1><section class="support-section"><div class="support-form-wrapper"><h2>Create a support ticket</h2><form class="support-form" data-support-form><div class="form-group"><label>Subject<input type="text" name="subject" placeholder="Brief description of your issue" required minlength="3" maxlength="180"></label></div><div class="form-group"><label>Category<select name="category" required><option value="">Select a category</option><option value="Technical">Technical issue</option><option value="Module">Module/course content</option><option value="Submission">Task submission</option><option value="Certificate">Completion/certificates</option><option value="Other">Other</option></select></label></div><div class="form-group"><label>Message<textarea name="message" placeholder="Please describe your issue in detail..." required minlength="5" maxlength="3000"></textarea></label></div><button class="button button-primary" type="submit">Send ticket →</button><p class="auth-message" data-support-error aria-live="polite"></p></form></div><div class="support-list-wrapper"><h2>Your tickets</h2><p class="support-status" data-support-status>Loading your tickets...</p><div class="support-tickets" data-support-tickets></div></div></section></main><script src="../js/support.js"></script></body></html>
